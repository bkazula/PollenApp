name: Main Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --dart-define=GOOGLE_POLLEN_API_KEY=${{ secrets.GOOGLE_POLLEN_API_KEY }}

      - name: Build Web
        run: flutter build web --release --dart-define=GOOGLE_POLLEN_API_KEY=${{ secrets.GOOGLE_POLLEN_API_KEY }}

      - name: Archive web build
        run: |
          cd build
          zip -r web-release.zip web

      - name: Prepare release tag
        id: release_meta
        run: |
          echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web-release.zip
